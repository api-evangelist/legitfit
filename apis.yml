apis:
- aid: legitfit-mcp
  name: LegitFit MCP Server
  description: >-
    LegitFit's Model Context Protocol server — a JSON-RPC 2.0 endpoint that exposes
    LegitFit resources to AI agents. Protected by OAuth 2.1 (authorization_code with
    PKCE S256) and gated by the mcp:read and mcp:write scopes. The tool surface
    requires an authenticated bearer token to enumerate; an unauthenticated call
    returns HTTP 401 with JSON-RPC error -32001. Rate limited to 60 requests per
    60-second window, signalled with the IETF RateLimit header fields.
  humanURL: https://legitfit.com/
  baseURL: https://legitfit.com/api/mcp
