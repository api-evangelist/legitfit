aid: legitfit
name: LegitFit
description: >-
  LegitFit is an Irish gym, studio and fitness-business management platform based in
  Cork, serving gyms, yoga and pilates studios, CrossFit boxes, leisure centres,
  personal trainers and multi-location operators. The product covers class and
  appointment scheduling with drag-and-drop timetables and waiting lists, membership
  and package management with auto-renewals, integrated online and offline payments
  built on Stripe, client and staff management, payroll and performance tracking,
  exercise programming, automated communications and lead nurture, a branded member
  app, and an AI assistant ("Lia") for revenue forecasting and programming. LegitFit
  publishes no public developer portal or OpenAPI description, but it does operate an
  OAuth 2.1-protected Model Context Protocol (MCP) server at https://legitfit.com/api/mcp,
  discoverable through RFC 8414 authorization-server and RFC 9728 protected-resource
  metadata, with mcp:read and mcp:write scopes.
